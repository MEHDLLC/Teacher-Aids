name: Build a category

# The build every category workflow calls. One implementation, because the
# five categories differ only in which catalogue they read: duplicating this
# file five times would mean five places to fix a pipeline bug and five
# chances to fix only four of them.
#
# The variables are not restated here. `teachergen plan` reads the category's
# catalogue and checks every variant against each generator's own option
# declaration, so a typo fails in the plan job in seconds rather than in every
# build job.

on:
  workflow_call:
    inputs:
      category:
        description: "Which category to build"
        required: true
        type: string
      limit:
        description: "How many items to build (blank builds everything)"
        required: false
        default: ""
        type: string
      pick:
        description: "Which ones, when limited: spread or first"
        required: false
        default: spread
        type: string
      generator:
        description: "Only this generator (blank for all in the category)"
        required: false
        default: ""
        type: string
      chunk_size:
        description: "Items per parallel job"
        required: false
        default: "6"
        type: string
      publish:
        description: "Publish the result as a GitHub release"
        required: false
        default: "no"
        type: string
      release_tag:
        description: "Override the tag (blank derives it from the catalogue)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan ${{ inputs.category }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -e .

      - name: Expand and validate the catalogue
        id: plan
        env:
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
          PICK: ${{ inputs.pick || 'spread' }}
          GENERATOR: ${{ inputs.generator }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '6' }}
        run: |
          set -euo pipefail
          ARGS=(--category "${CATEGORY}" --pick "${PICK}" --chunk-size "${CHUNK_SIZE}")
          [ -n "${LIMIT}" ] && ARGS+=(--limit "${LIMIT}")
          [ -n "${GENERATOR}" ] && ARGS+=(--generator "${GENERATOR}")

          teachergen plan "${ARGS[@]}" --emit table
          COUNT=$(teachergen plan "${ARGS[@]}" --emit count)
          MATRIX=$(teachergen plan "${ARGS[@]}" --emit matrix)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          JOBS=$(echo "${MATRIX}" | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "Planning ${COUNT} ${CATEGORY} models across ${JOBS} jobs" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ inputs.category }} ${{ matrix.chunk }}/${{ matrix.chunks }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One bad variant should not cancel the rest; the collect job reports it.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -e .

      - name: Build this chunk
        env:
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
          PICK: ${{ inputs.pick || 'spread' }}
          GENERATOR: ${{ inputs.generator }}
        run: |
          set -euo pipefail
          ARGS=(--category "${CATEGORY}" --pick "${PICK}"
                --chunk ${{ matrix.chunk }} --chunks ${{ matrix.chunks }})
          [ -n "${LIMIT}" ] && ARGS+=(--limit "${LIMIT}")
          [ -n "${GENERATOR}" ] && ARGS+=(--generator "${GENERATOR}")
          # `batch` re-reads every file it writes and fails on a bad mesh.
          # --keep-going finishes the chunk first so one failure does not hide
          # the others.
          teachergen batch "${ARGS[@]}" --out out --keep-going

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.category }}-chunk-${{ matrix.chunk }}
          path: out/
          retention-days: 14

  collect:
    name: Collect ${{ inputs.category }}
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -e .

      - name: Gather every chunk
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: ${{ inputs.category }}-chunk-*
          merge-multiple: true

      # Chunk-level index files describe one chunk each; drop them and rebuild
      # one index over everything.
      - name: Re-index
        run: |
          set -euo pipefail
          rm -f release/INDEX.md release/index.json
          teachergen index release

      # Validated once per chunk already; done again here on the merged set,
      # because what ships is this directory, not what any one job had.
      - name: Verify everything that shipped
        run: teachergen verify release --json release/verify.json

      # The tag names the product line and comes out of the catalogue, so it
      # cannot drift from what the run actually built.
      - name: Work out what this release is called
        id: release
        env:
          CATEGORY: ${{ inputs.category }}
          OVERRIDE: ${{ inputs.release_tag }}
          LIMIT: ${{ inputs.limit }}
          GENERATOR: ${{ inputs.generator }}
        run: |
          set -euo pipefail
          # Mirror the selection the build jobs used, so "complete" reflects
          # what was actually built rather than what the catalogue holds.
          ARGS=(--category "${CATEGORY}")
          [ -n "${LIMIT}" ] && ARGS+=(--limit "${LIMIT}")
          [ -n "${GENERATOR}" ] && ARGS+=(--generator "${GENERATOR}")
          INFO=$(teachergen plan "${ARGS[@]}" --emit release)
          echo "$INFO"
          TAG=$(echo "$INFO" | python -c 'import json,sys; print(json.load(sys.stdin)["tag"])')
          TITLE=$(echo "$INFO" | python -c 'import json,sys; print(json.load(sys.stdin)["display"])')
          COMPLETE=$(echo "$INFO" | python -c 'import json,sys; print(json.load(sys.stdin)["complete"])')
          echo "tag=${OVERRIDE:-$TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "complete=${COMPLETE}" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: teachergen notes release --category ${{ inputs.category }} --verify release/verify.json

      - name: Summarise
        if: always()
        run: |
          cat release/RELEASE-NOTES.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "Planned ${{ needs.plan.outputs.count }} items; build result: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.category }}-models
          path: release/
          retention-days: 90

      # A tag claims to be the whole catalogue, so refuse to hang one on a run
      # that was narrowed by limit or generator.
      - name: Refuse to publish a partial run
        if: inputs.publish == 'yes' && steps.release.outputs.complete != 'True'
        run: |
          echo "This run built ${{ needs.plan.outputs.count }} of the ${{ inputs.category }} catalogue, not all of it." >&2
          echo "Publishing it as ${{ steps.release.outputs.tag }} would claim more than it contains." >&2
          echo "Re-run with no limit and no generator filter, or pass release_tag to name it something else." >&2
          exit 1

      - name: Publish the release
        if: inputs.publish == 'yes' && needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          ( cd release && zip -qr "../${TAG}.zip" . )
          ls -lh "${TAG}.zip"
          # --target pins the tag to the commit that was built. Without it the
          # tag would be cut from the default branch, which is not this code.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TAG}.zip" --clobber
            gh release edit "${TAG}" --title "${TITLE}" \
              --notes-file release/RELEASE-NOTES.md
          else
            gh release create "${TAG}" "${TAG}.zip" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release/RELEASE-NOTES.md
          fi
          echo "Published ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          gh release view "${TAG}" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any build job failed
        if: needs.build.result != 'success'
        run: |
          echo "One or more build chunks failed; see the build jobs above." >&2
          exit 1
