name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Pure Python and numpy. No OpenSCAD, no virtual display: the geometry
      # comes from manifold3d and the previews from a software rasteriser, so
      # nothing here needs a GPU or an X server.
      - name: Install
        run: pip install -e ".[test]"

      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Every catalogue expands and every variant validates
        run: |
          set -euo pipefail
          for category in $(teachergen categories | awk 'NF && !/^ /{print $1}'); do
            echo "== ${category} =="
            teachergen plan --category "${category}" --emit count
          done
          echo "$(teachergen plan --emit count) models across all categories" >> "$GITHUB_STEP_SUMMARY"

      # One model per category: covers every category's catalogue and the
      # whole pipeline without paying for 80 builds on every push.
      - name: Smoke build, one per category
        run: |
          set -euo pipefail
          for category in alphabet math organization classroom games; do
            teachergen batch --category "${category}" --limit 1 --out out
          done

      - name: Verify the files that were written
        run: teachergen verify out --json out/verify.json

      - name: Summarise
        if: always()
        run: cat out/INDEX.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-build
          path: out/
          retention-days: 7

  proof-sheets:
    name: Font and pattern proof sheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -e .

      # The font is data, and a glyph that has gone wrong is obvious in a
      # picture and invisible in a diff.
      - name: Render every glyph and every pattern
        run: |
          python tools/font_sheet.py --out proofs
          python tools/pattern_sheet.py --out proofs

      - uses: actions/upload-artifact@v7
        with:
          name: proof-sheets
          path: proofs/
          retention-days: 30
