name: Letters and literacy

# Builds the alphabet catalogue: Letter and number tiles in six themes, and letter stencils.
#
# Runs on its own, so a teacher after alphabet models never waits on any
# other category. The pipeline itself lives in build-category.yml.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many items to build (blank builds everything)"
        required: false
        default: ""
      pick:
        description: "Which ones, when limited"
        required: false
        default: spread
        type: choice
        options: [spread, first]
      generator:
        description: "Only this generator (blank for all)"
        required: false
        default: ""
      chunk_size:
        description: "Items per parallel job"
        required: false
        default: "6"
      publish:
        description: "Publish the result as a GitHub release"
        required: false
        default: "no"
        type: choice
        options: [ "no", "yes" ]
      release_tag:
        description: "Override the tag (blank derives it from the catalogue)"
        required: false
        default: ""
  push:
    paths:
      # This category's own catalogue and its own generators.
      - catalogues/alphabet.json
      - src/teacheraids/generators/letter_tile.py
      - src/teacheraids/generators/stencil.py
      - src/teacheraids/generators/__init__.py
      # The shared engine, which is deliberately not narrowed: a change to
      # font.py redraws every letterform, and one to geom.py or mesh_io.py
      # changes every mesh in the repo. Those have to rebuild all five
      # categories or the published sets quietly fall out of date. The single
      # `*` does not match a slash, so this is the top-level modules only and
      # not the generators directory above.
      - src/teacheraids/*.py
      # And the workflow that builds it.
      - .github/workflows/alphabet.yml
      - .github/workflows/build-category.yml

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-category.yml
    permissions:
      contents: write
    with:
      category: alphabet
      limit: ${{ inputs.limit || '' }}
      pick: ${{ inputs.pick || 'spread' }}
      generator: ${{ inputs.generator || '' }}
      chunk_size: ${{ inputs.chunk_size || '6' }}
      publish: ${{ inputs.publish || 'no' }}
      release_tag: ${{ inputs.release_tag || '' }}
