[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-aids"
version = "0.1.0"
description = "Parametric generators for printable classroom teaching aids"
requires-python = ">=3.10"
dependencies = ["manifold3d>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
# Only the workflow tests need this: they read the YAML in .github/workflows
# and check it against the generator registry. Keeping it out of the runtime
# dependencies means printing a model never needs a YAML parser.
test = ["pyyaml>=6"]

[project.scripts]
teachergen = "teacheraids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
