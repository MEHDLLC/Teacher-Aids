[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-aids"
version = "0.1.0"
description = "Parametric generators for printable classroom teaching aids"
requires-python = ">=3.10"
dependencies = ["manifold3d>=2.5", "numpy>=1.24"]

[project.scripts]
teachergen = "teacheraids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
